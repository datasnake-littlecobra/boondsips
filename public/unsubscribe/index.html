<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Unsubscribe · Boond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF2D6;--ink:#3A2A16;--card:#FFF8E8;--cta:#FF4F7E;--line:#3A2A16;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#1E160C;--ink:#FFF2D6;--card:#2A1F12;--line:#0E0A05;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--ink);font:600 18px/1.6 "Nunito",system-ui,sans-serif}
main{width:100%;max-width:480px;padding:32px 26px;background:var(--card);border:3px solid var(--line);border-radius:30px;box-shadow:8px 8px 0 var(--line)}
.wm{display:inline-block;margin-bottom:18px;font:700 2.2rem/1 "Fredoka",sans-serif;color:var(--ink);text-decoration:none}
h1{margin:0 0 14px;font:700 2rem/1.1 "Fredoka",sans-serif}
p{margin:0 0 18px}
a{color:var(--ink)}
.btn{font:800 1.05rem/1 "Nunito",sans-serif;color:#3A2A16;background:var(--cta);border:3px solid #3A2A16;border-radius:999px;padding:16px 28px;cursor:pointer;box-shadow:5px 5px 0 #3A2A16}
.btn:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid #14B5B0;outline-offset:3px}
</style>
</head>
<body>
<main>
  <a class="wm" href="/">boond</a>
  <h1>Unsubscribe from Boond emails</h1>
  <p id="msg" role="status" aria-live="polite">One moment...</p>
  <p><button class="btn" id="go" type="button" hidden>Unsubscribe me</button></p>
  <p><a href="/">Back to boondsips.com</a></p>
</main>
<script>
(function(){
  "use strict";
  var API = "https://lkytlauunqhhfjyjqmsb.supabase.co/functions/v1/boond-waitlist";
  var t = new URLSearchParams(location.search).get("t") || "";
  var valid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(t);
  var msg = document.getElementById("msg"), go = document.getElementById("go");
  if (!valid) { msg.textContent = "This link looks incomplete. Write to hello@boondsips.com and we will remove you."; return; }
  msg.textContent = "Tap the button to stop getting emails from Boond.";
  go.hidden = false;
  go.addEventListener("click", function(){
    go.disabled = true;
    fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({action:"unsubscribe", token:t})})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        if (res.ok && res.j && res.j.ok) { msg.textContent = "You are unsubscribed. We are sorry to see you go."; go.hidden = true; }
        else { throw new Error("fail"); }
      })
      .catch(function(){ msg.textContent = "Something went wrong. Write to hello@boondsips.com and we will remove you."; go.disabled = false; });
  });
})();
</script>
</body>
</html>
